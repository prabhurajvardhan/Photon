[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoware-photon"
version = "0.1.0-beta"
description = "Photon by Nanoware AI — ~49 MB offline Python & TypeScript patch engine & MCP server."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["onnxruntime>=1.18.0", "tokenizers>=0.19.0", "numpy>=1.24.0", "huggingface-hub>=0.23.0"]

[project.scripts]
photon = "photon_ai.cli:main"
